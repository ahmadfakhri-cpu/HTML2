<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Pages</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <img
        class="logo"
        src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg"
        alt="facebook logo"
      />
      <div class="card">
        <form action="">
          <p class="login-title">Login Ke Facebookk</p>
          <div class="input-container">
            <input
              type="text"
              class="input"
              placeholder="Email atau Nomor Telepon"
              required
            />
            <input
              type="password"
              class="input"
              placeholder="Kata Sandi"
              required
            />

            <button type="button" class="btn-submit">Masuk</button>
            <a href="forgot-account.html" class="forgot-account">Lupa Akun?</a>
          </div>  

          <p class="addition">Atau</p>

          <div class="container-create-account">
            <a href="" class="btn-create-account">Buat akun Baru </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
